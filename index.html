<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Rental Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fc;
}

header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:20px auto;
}

.vehicle-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#28a745;
    color:white;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#218838;
}

.booking-form{
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.booking-form h2{
    margin-bottom:15px;
}

input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

#result{
    margin-top:15px;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>

<header>
    <h1>🚗 Vehicle Rental Management System</h1>
    <p>HTML + CSS + JavaScript + API</p>
</header>

<div class="container">

    <div class="vehicle-grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800" alt="Car">
            <div class="card-content">
                <h3>Luxury Car</h3>
                <p class="price">₹2000 / Day</p>
                <button onclick="selectVehicle('Luxury Car')">Rent Now</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=800" alt="Bike">
            <div class="card-content">
                <h3>Sports Bike</h3>
                <p class="price">₹800 / Day</p>
                <button onclick="selectVehicle('Sports Bike')">Rent Now</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=800" alt="Scooter">
            <div class="card-content">
                <h3>Electric car</h3>
                <p class="price">₹500 / Day</p>
                <button onclick="selectVehicle('Electric Scooter')">Rent Now</button>
            </div>
        </div>

    </div>

    <div class="booking-form">
        <h2>Book a Vehicle</h2>

        <input type="text" id="customerName" placeholder="Enter Customer Name">

        <select id="vehicle">
            <option value="">Select Vehicle</option>
            <option>Luxury Car</option>
            <option>Sports Bike</option>
            <option>Electric car</option>
        </select>

        <input type="date" id="date">

        <button onclick="bookVehicle()">Confirm Booking</button>

        <div id="result"></div>
    </div>

</div>

<script>
function selectVehicle(vehicleName){
    document.getElementById("vehicle").value = vehicleName;
}

async function bookVehicle(){

    let name = document.getElementById("customerName").value;
    let vehicle = document.getElementById("vehicle").value;
    let date = document.getElementById("date").value;

    if(name === "" || vehicle === "" || date === ""){
        alert("Please fill all fields");
        return;
    }

    const bookingData = {
        customer:name,
        vehicle:vehicle,
        bookingDate:date
    };

    try{
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(bookingData)
            }
        );

        const data = await response.json();

        document.getElementById("result").innerHTML =
        `
        ✅ Booking Successful!<br>
        Booking ID: ${data.id}<br>
        Customer: ${name}<br>
        Vehicle: ${vehicle}<br>
        Date: ${date}
        `;
    }
    catch(error){
        document.getElementById("result").innerHTML =
        "❌ Booking Failed!";
    }
}
</script>

</body>
</html>
